name: Sync with upstream
on:
  schedule:
    - cron: "12 * * * *"
  push:

jobs:
  sync-mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Update mirror
        uses: projg2/crate-dist-mirror-action@v2
        with:
          directories: ntpd
          ssh-private-key: ${{ secrets.ssh_key }}
