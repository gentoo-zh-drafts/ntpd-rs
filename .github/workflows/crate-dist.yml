
name: Create crate dist
on:
  push:
    tags:
      - '**'

jobs:
  crate-dist:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create crate dist
        uses: projg2/crate-dist-action@v1
        with:
          directories: ntpd
          dist-filename: ntpd-rs-2.0.0-alpha.20260715-crates.tar.xz
          run-cargo-update: false

